<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Shop the latest collection at Radha Boutique.">

    <title>Shop Collection | Radha Boutique</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <nav class="navbar">


            <!-- LOGO -->

            <a
                href="index.html"
                class="brand">

                <img
                    src="images/logo.png"
                    alt="Radha Boutique">

            </a>


            <!-- MOBILE MENU -->

            <button
                class="menu-toggle"
                type="button"
                onclick="toggleMenu()"
                aria-label="Open menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- NAVIGATION -->

            <ul
                id="mobileMenu"
                class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a
                        href="shop.html"
                        class="active">
                        Shop
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        ♡ Wishlist
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                        <span
                            id="cartCount"
                            class="cart-count">
                            0
                        </span>
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ================= SHOP HERO ================= -->

    <main class="shop-page">


        <section class="shop-hero">

            <span class="eyebrow">
                RADHA BOUTIQUE
            </span>

            <h1>
                Our Collection
            </h1>

            <p>
                Discover elegant styles made for
                every occasion.
            </p>

        </section>



        <!-- ================= SEARCH ================= -->

        <section class="shop-controls">


            <div class="search-container">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search for kurtis, cord sets, denim..."
                    oninput="searchProducts()">

            </div>



            <!-- ================= FILTER ================= -->

            <div class="filter-container">

                <button
                    type="button"
                    onclick="filterProducts('All')">

                    All

                </button>


                <button
                    type="button"
                    onclick="filterProducts('Kurti')">

                    Kurtis

                </button>


                <button
                    type="button"
                    onclick="filterProducts('Cord Set')">

                    Cord Sets

                </button>


                <button
                    type="button"
                    onclick="filterProducts('Denim')">

                    Denim

                </button>


                <button
                    type="button"
                    onclick="filterProducts('Dress')">

                    Dresses

                </button>

            </div>



            <!-- ================= SORT ================= -->

            <div class="sort-container">

                <label for="sortProducts">
                    Sort by:
                </label>

                <select
                    id="sortProducts"
                    onchange="sortProducts(this.value)">

                    <option value="">
                        Featured
                    </option>

                    <option value="low">
                        Price: Low to High
                    </option>

                    <option value="high">
                        Price: High to Low
                    </option>

                    <option value="name">
                        Name: A to Z
                    </option>

                </select>

            </div>

        </section>



        <!-- ================= PRODUCTS ================= -->

        <section class="shop-products section">


            <div
                id="productContainer"
                class="product-container">

            </div>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">


        <div>

            <strong>
                Radha Boutique
            </strong>

            <p>
                Elegant fashion for every occasion.
            </p>

        </div>



        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>



        <p class="copyright">

            © 2026 Radha Boutique.
            All rights reserved.

        </p>


    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="products.js"></script>

    <script src="script.js"></script>


    <!-- CATEGORY FROM HOMEPAGE -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const category =
                    params.get("category");


                if (category) {

                    filterProducts(
                        category
                    );

                }

            }
        );

    </script>


</body>

</html>
