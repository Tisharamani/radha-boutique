<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Radha Boutique</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <nav class="navbar">

            <a href="index.html" class="brand">
                <img
                    src="images/logo.png"
                    alt="Radha Boutique">
            </a>

            <button
                class="menu-toggle"
                type="button"
                onclick="toggleMenu()"
                aria-expanded="false">
                ☰
            </button>

            <ul id="mobileMenu" class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="shop.html">
                        Shop
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        ♡ Wishlist
                    </a>
                </li>

                <li>
                    <a href="cart.html" class="active">
                        Cart
                        <span id="cartCount" class="cart-count">
                            0
                        </span>
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CART -->

    <main>

        <section class="cart-container">

            <div class="section-heading">

                <span class="eyebrow">
                    RADHA BOUTIQUE
                </span>

                <h1>
                    Your Shopping Cart
                </h1>

                <p>
                    Review your selected items before checkout.
                </p>

            </div>


            <!-- CART PRODUCTS -->

            <div id="cartItems"></div>


            <!-- TOTAL -->

            <div class="cart-total">

                <h2 id="totalPrice">
                    Total: ₹0
                </h2>

            </div>


            <!-- BUTTONS -->

            <div class="cart-actions">

                <button
                    class="clear-cart-btn"
                    onclick="clearCart()">
                    Clear Cart
                </button>


                <a href="checkout.html">

                    <button class="checkout-btn">
                        Proceed To Checkout
                    </button>

                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div>

            <strong>
                Radha Boutique
            </strong>

            <p>
                Elegant fashion for every occasion.
            </p>

        </div>

        <div class="footer-links">

            <a href="shop.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

        <p class="copyright">
            © 2026 Radha Boutique. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="products.js"></script>
    <script src="script.js"></script>

</body>

</html>
